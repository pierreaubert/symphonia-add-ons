[package]
name = "rdsd2pcm"
description = "A pure Rust library for converting DSD audio to PCM."
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/clone206/rdsd2pcm"
keywords = ["audio", "dsd", "pcm", "sacd", "decoder"]
categories = ["multimedia", "multimedia::audio", "multimedia::encoding"]

[dependencies]
dsd-reader = { path = "src/dsd_reader" }
log = { version = "0.4.28", features = ["std"] }
flac-codec = { version = "1.2.0", optional = true }
id3 = { version = "1.16.3", optional = true }
rand = { version = "0.9.2", optional = true }

[features]
default = ["file-io"]
# File-conversion API (Rdsd2Pcm, writers, dither, file discovery, metadata).
# The DSP core (DsdPcmConverter/DsdPcmOptions) builds without it, dropping
# rand, flac-codec and id3 from the dependency closure.
file-io = ["dep:flac-codec", "dep:id3", "dep:rand"]

# Note: crate-level lint overrides live next to the code they justify
# (filter tables, legacy constructor), not as a blanket allow.
